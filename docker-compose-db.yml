version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: TurboMechanic-sqlserver
    
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=StrongPassw0rd123
      - MSSQL_PID=Developer
    ports:
      - "1431:1433"
    volumes:
      - TurboMechanic-data:/var/opt/mssql
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge

volumes:
  TurboMechanic-data: